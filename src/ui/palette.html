<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Vault Palette</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="pv-header">
        <div>
          <div class="pv-title">Prompt Vault</div>
          <div class="pv-subtitle">Local-first prompt palette</div>
        </div>
        <div class="pv-header-actions">
          <button id="new-prompt" aria-label="Create prompt" title="New prompt (⌘/Ctrl+N)">＋</button>
          <button id="close" aria-label="Close palette">✕</button>
        </div>
      </header>
      <div class="pv-input-row">
        <input id="query" type="text" autocomplete="off" placeholder="Search prompts..." autofocus />
      </div>
      <div class="pv-hints" aria-live="polite">
        Enter to insert · ⌘/Ctrl+N new · ⌘/Ctrl+E edit · Esc / ⌘/Ctrl+K close
      </div>
      <section id="editor" class="pv-editor" hidden aria-label="Prompt editor">
        <div class="pv-editor-heading">
          <strong id="editor-title">New prompt</strong>
          <button id="editor-close" type="button" aria-label="Close editor">✕</button>
        </div>
        <label>Title <input id="prompt-title" type="text" autocomplete="off" placeholder="Optional" /></label>
        <label>Prompt <textarea id="prompt-body" rows="6" placeholder="Write a prompt. Use {{variable}} for fill-in values."></textarea></label>
        <label>Tags <input id="prompt-tags" type="text" autocomplete="off" placeholder="research, writing" /></label>
        <div class="pv-editor-footer">
          <label class="pv-pin"><input id="prompt-pinned" type="checkbox" /> Pin this prompt</label>
          <span id="editor-status" aria-live="polite"></span>
          <button id="delete-prompt" type="button" class="pv-danger" hidden>Delete</button>
        </div>
      </section>
      <section id="variables" class="pv-editor" hidden aria-label="Template variables">
        <div class="pv-editor-heading"><strong>Fill template values</strong><button id="variables-cancel" type="button">Cancel</button></div>
        <div id="variable-fields"></div>
        <div class="pv-editor-footer"><span>Enter inserts · Esc cancels</span><button id="variables-insert" type="button">Insert</button></div>
      </section>
      <div id="results" class="pv-results" aria-live="polite"></div>
      <div id="toast" class="pv-toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./palette.js"></script>
  </body>
</html>
